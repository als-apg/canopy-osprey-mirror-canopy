[project]
name = "canopy"
dynamic = ["version"]
description = "Canopy — backend for the SLAC EED control-system display platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "aioca>=1.7",
    "p4p>=4.1",
    "numpy>=1.26",
    "numexpr>=2.8",
    "asteval>=1.0",
    "jsonschema>=4.21,<5",
    "python-multipart>=0.0.32",
    "pymongo>=4.17",
    # The oldest release the live-frame encoding is tested with: numpy
    # arrays serialised natively, non-finite numbers as null.
    "orjson>=3.9.3",
]

[project.optional-dependencies]
# canopy_mcp: the panel-builder MCP server shipped in the same wheel. Kept out of
# the core dependencies so canopy-api and canopy-worker images stay lean.
mcp = [
    "fastmcp>=3.4.4",
    "starlette>=0.40",
    "httpx>=0.27",
    # >=14: the first release whose asyncio client has ``process_redirect``,
    # which the screenshot browser's relay needs to refuse redirects.
    "websockets>=14",
    "jsonschema>=4.21,<5",
    # >=1.61 is OSPREY's own floor; the browser tests run on the locked 1.63.
    "playwright>=1.61",
    # Kills a Playwright driver that will not stop, with its process tree.
    "psutil>=6",
]
# Postgres and the Redis job queue: needed by squirrel, magpie, jobs and the
# canopy-worker. A deployment that selects none of them (CANOPY_MODULES) runs
# without this extra.
data = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
]
# Legacy-screen conversion: needed by the converter module and its worker task.
convert = [
    "PyDMConverter>=1.0.5",
]

[tool.uv.sources]
# The convert extra needs .bob conversion and pydmconverter.scheme, which no
# PyDMConverter release carries; this pins the commit that does.
PyDMConverter = { git = "https://github.com/als-apg/canopy-osprey-mirror-pydm-converter-tool", rev = "8bd16bbc31c8a4074719900f1cd85d90a0549edc" }

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "fakeredis>=2.21",
    "caproto>=1.1",
    "coverage>=7.15.1",
    "pyyaml>=6",
]
docs = [
    "zensical>=0.0.51",
    "mkdocstrings",
    "mkdocstrings-python",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
# canopy_mcp is a second package of the same wheel, not a uv workspace member:
# docker/Dockerfile.dev syncs from pyproject.toml + uv.lock before any member
# directory exists.
packages = ["src/canopy", "src/canopy_mcp"]

[tool.ruff]
extend-exclude = ["__init__.py"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = ["E402", "E501"]

[tool.isort]
profile = "black"
color_output = true
extend_skip = ["__init__.py"]
length_sort = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: needs a running canopy stack; skipped unless CANOPY_LIVE=1",
    "mongo: needs Docker and the local mongo:7 image; starts a throwaway MongoDB container",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
relative_files = true
source = ["src/canopy"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.importlinter]
root_packages = ["canopy", "canopy_mcp"]
# Needed for the contract below that names packages outside this repository.
include_external_packages = true

# OSPREY builds on canopy, never the other way round: canopy stays installable
# and importable without any OSPREY package present.
[[tool.importlinter.contracts]]
name = "canopy and canopy_mcp never import osprey"
type = "forbidden"
source_modules = ["canopy", "canopy_mcp"]
forbidden_modules = ["osprey", "osprey_connectors"]

# canopy_mcp is a client of the canopy backend, never a dependency of it.
[[tool.importlinter.contracts]]
name = "canopy never imports canopy_mcp"
type = "forbidden"
source_modules = ["canopy"]
forbidden_modules = ["canopy_mcp"]

# canopy_mcp talks to canopy over HTTP. It may use the shared kernel
# (canopy.core, canopy.contracts) and, for the fox formula checks, the fox
# gateway; every other module is off limits.
[[tool.importlinter.contracts]]
name = "canopy_mcp reaches canopy modules only through the fox gateway"
type = "forbidden"
source_modules = ["canopy_mcp"]
forbidden_modules = [
    "canopy.fox",
    "canopy.mole",
    "canopy.hare",
    "canopy.vole",
    "canopy.raccoon",
    "canopy.jobs",
    "canopy.converter",
    "canopy.squirrel",
    "canopy.magpie",
    "canopy.analytics",
    "canopy.epics",
]
ignore_imports = [
    "canopy_mcp.fox -> canopy.fox.gateway",
]

# The converter must reach peer modules only through their public gateway —
# never their services/api/internals. The shared kernel (canopy.core,
# canopy.contracts) and each module's gateway are allowed.
[[tool.importlinter.contracts]]
name = "Converter reaches other modules only through their public gateway"
type = "forbidden"
source_modules = ["canopy.converter"]
forbidden_modules = [
    "canopy.fox",
    "canopy.mole",
    "canopy.hare",
    "canopy.vole",
    "canopy.raccoon",
    "canopy.jobs",
]
ignore_imports = [
    "canopy.converter.dependencies -> canopy.fox.gateway",
    "canopy.converter.api.v1.conversions -> canopy.jobs.gateway",
    "canopy.converter.tasks -> canopy.jobs.gateway",
]
