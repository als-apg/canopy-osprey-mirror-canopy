[project]
name = "canopy"
dynamic = ["version"]
description = "Canopy — backend for the SLAC EED control-system display platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.1",
    # The oldest release that leaves the event-loop policy alone, so a subprocess
    # started under a served app can spawn; proven by the floors job.
    "uvicorn[standard]>=0.36",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "httpx>=0.27",
    "aioca>=1.7",
    # The oldest release with a Python 3.12 wheel: every 4.1 release needs an EPICS
    # base (epicscorelibs < 7.0.7.99.1) built from source; proven by the floors job.
    "p4p>=4.2",
    "numpy>=1.26",
    # The oldest release that installs on Python 3.12 (from source: the first
    # cp312 wheel is 2.8.7), proven by the floors job.
    "numexpr>=2.8.3",
    "asteval>=1.0",
    "jsonschema>=4.21,<5",
    "python-multipart>=0.0.32",
    # The oldest release the live-frame encoding is tested with: numpy
    # arrays serialised natively, non-finite numbers as null.
    "orjson>=3.9.3",
    # GET /metrics and the per-route HTTP middleware (canopy.core.metrics) run in every process.
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# canopy_mcp: the panel-builder MCP server shipped in the same wheel. Kept out of
# the core dependencies so canopy-api and canopy-worker images stay lean.
# httpx and jsonschema, which it also uses, are core dependencies.
mcp = [
    "fastmcp>=3.4.4",
    "starlette>=0.40",
    # >=14: the first release whose asyncio client has ``process_redirect``,
    # which the screenshot browser's relay needs to refuse redirects.
    "websockets>=14",
    # The screenshot browser; its tests run on the locked 1.63.
    "playwright>=1.61",
    # Kills a Playwright driver that will not stop, with its process tree.
    "psutil>=6",
]
# Postgres and the Redis job queue: needed by squirrel, magpie, jobs and the
# canopy-worker. A deployment that selects none of them (CANOPY_MODULES) runs
# without this extra.
data = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
]
# Legacy-screen conversion: needed by the converter module and its worker task.
convert = [
    "PyDMConverter>=1.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.6",
    "pytest>=8.0",
    # The oldest release that collects package directories under pytest 8, proven
    # by the floors job.
    "pytest-asyncio>=0.23.5",
    "pytest-httpx>=0.30",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    # The oldest release that gives each FakeRedis() a server of its own, which the
    # tests rely on for isolation; proven by the floors job.
    "fakeredis>=2.21.3",
    "caproto>=1.1",
    "coverage>=7.15.1",
    "pyyaml>=6",
]
docs = [
    "zensical>=0.0.51",
    "mkdocstrings>=0.24",
    "mkdocstrings-python>=1.8",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
# canopy_mcp is a second package of the same wheel, not a uv workspace member:
# docker/Dockerfile.dev syncs from pyproject.toml + uv.lock before any member
# directory exists.
packages = ["src/canopy", "src/canopy_mcp"]

[tool.ruff]
extend-exclude = ["__init__.py"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
# isinstance takes a tuple of types; the union form is slower and ruff has since removed the rule.
ignore = ["E402", "E501", "UP038"]

[tool.isort]
profile = "black"
color_output = true
extend_skip = ["__init__.py"]
length_sort = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: needs a running canopy stack; skipped unless CANOPY_LIVE=1",
    "perf: asserts timing bounds that hold on operator-class hardware; deselected on shared CI runners",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
relative_files = true
source = ["src/canopy"]
# Async SQLAlchemy runs queries in greenlets; without this, lines after a DB await go untraced.
concurrency = ["thread", "greenlet"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.importlinter]
root_packages = ["canopy", "canopy_mcp"]

# canopy_mcp is a client of the canopy backend, never a dependency of it.
[[tool.importlinter.contracts]]
name = "canopy never imports canopy_mcp"
type = "forbidden"
source_modules = ["canopy"]
forbidden_modules = ["canopy_mcp"]

# canopy_mcp talks to canopy over HTTP. It may use the shared kernel
# (canopy.core, canopy.contracts) and, for the fox formula checks, the fox
# gateway; every other module is off limits.
[[tool.importlinter.contracts]]
name = "canopy_mcp reaches canopy modules only through the fox gateway"
type = "forbidden"
source_modules = ["canopy_mcp"]
forbidden_modules = [
    "canopy.fox",
    "canopy.mole",
    "canopy.hare",
    "canopy.vole",
    "canopy.raccoon",
    "canopy.jobs",
    "canopy.converter",
    "canopy.squirrel",
    "canopy.magpie",
    "canopy.analytics",
    "canopy.epics",
]
ignore_imports = [
    "canopy_mcp.fox -> canopy.fox.gateway",
]

# The converter must reach peer modules only through their public gateway —
# never their services/api/internals. The shared kernel (canopy.core,
# canopy.contracts) and each module's gateway are allowed.
[[tool.importlinter.contracts]]
name = "Converter reaches other modules only through their public gateway"
type = "forbidden"
source_modules = ["canopy.converter"]
forbidden_modules = [
    "canopy.fox",
    "canopy.mole",
    "canopy.hare",
    "canopy.vole",
    "canopy.raccoon",
    "canopy.jobs",
]
ignore_imports = [
    "canopy.converter.dependencies -> canopy.fox.gateway",
    "canopy.converter.api.v1.conversions -> canopy.jobs.gateway",
    "canopy.converter.tasks -> canopy.jobs.gateway",
]
