[project]
name = "canopy"
dynamic = ["version"]
description = "Canopy — backend for the SLAC EED control-system display platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "aioca>=1.7",
    "p4p>=4.1",
    "numpy>=1.26",
    "numexpr>=2.8",
    "asteval>=1.0",
    "jsonschema>=4.21,<5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "PyDMConverter>=1.0.5",
    "python-multipart>=0.0.32",
    "pymongo>=4.17",
    "orjson>=3.12.0",
]

[project.optional-dependencies]
# canopy_mcp: the panel-builder MCP server shipped in the same wheel. Kept out of
# the core dependencies so canopy-api and canopy-worker images stay lean.
mcp = [
    "fastmcp>=2.10",
    "starlette>=0.40",
    "httpx>=0.27",
    "websockets>=13",
    "jsonschema>=4.21,<5",
    "playwright>=1.45",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "fakeredis>=2.21",
    "coverage>=7.15.1",
    "pyyaml>=6",
]
docs = [
    "zensical>=0.0.51",
    "mkdocstrings",
    "mkdocstrings-python",
]

[tool.uv.sources]
# Interim: the unreleased pydm-converter-tool branch carrying the .bob adapter,
# checked out beside this repo. Replace with the merged commit once it lands, e.g.
#   pydmconverter = { git = "https://github.com/slaclab/pydm-converter-tool.git", rev = "<merged-sha>" }
# and drop this block entirely once a PyPI release includes it.
pydmconverter = { path = "../../../../pydm-converter-tool/.claude/worktrees/panel-builder", editable = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
# canopy_mcp is a second package of the same wheel, not a uv workspace member:
# docker/Dockerfile.dev syncs from pyproject.toml + uv.lock before any member
# directory exists.
packages = ["src/canopy", "src/canopy_mcp"]

[tool.ruff]
extend-exclude = ["__init__.py"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = ["E402", "E501"]

[tool.isort]
profile = "black"
color_output = true
extend_skip = ["__init__.py"]
length_sort = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: needs a running canopy stack; skipped unless CANOPY_LIVE=1",
    "mongo: needs Docker and the local mongo:7 image; starts a throwaway MongoDB container",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
relative_files = true
source = ["src/canopy"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.importlinter]
root_packages = ["canopy", "canopy_mcp"]

# canopy_mcp is a client of the canopy backend, never a dependency of it.
[[tool.importlinter.contracts]]
name = "canopy never imports canopy_mcp"
type = "forbidden"
source_modules = ["canopy"]
forbidden_modules = ["canopy_mcp"]

# canopy_mcp talks to canopy over HTTP. It may use the shared kernel
# (canopy.core, canopy.contracts) and, for the fox formula checks, the fox
# gateway; every other module is off limits.
[[tool.importlinter.contracts]]
name = "canopy_mcp reaches canopy modules only through the fox gateway"
type = "forbidden"
source_modules = ["canopy_mcp"]
forbidden_modules = [
    "canopy.fox",
    "canopy.mole",
    "canopy.hare",
    "canopy.vole",
    "canopy.raccoon",
    "canopy.beaver",
    "canopy.jobs",
    "canopy.converter",
    "canopy.squirrel",
    "canopy.magpie",
    "canopy.analytics",
    "canopy.epics",
]
ignore_imports = [
    "canopy_mcp.fox -> canopy.fox.gateway",
]

# The converter must reach peer modules only through their public gateway —
# never their services/api/internals. The shared kernel (canopy.core,
# canopy.contracts) and each module's gateway are allowed.
[[tool.importlinter.contracts]]
name = "Converter reaches other modules only through their public gateway"
type = "forbidden"
source_modules = ["canopy.converter"]
forbidden_modules = [
    "canopy.fox",
    "canopy.mole",
    "canopy.hare",
    "canopy.vole",
    "canopy.raccoon",
    "canopy.beaver",
    "canopy.jobs",
]
ignore_imports = [
    "canopy.converter.dependencies -> canopy.fox.gateway",
    "canopy.converter.adapters.beaver_registry -> canopy.beaver.gateway",
    "canopy.converter.adapters.beaver_registry -> canopy.beaver.errors",
    "canopy.converter.api.v1.conversions -> canopy.jobs.gateway",
    "canopy.converter.tasks -> canopy.jobs.gateway",
]
