name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. v1.2.0 or main-abc1234)'
        required: true
        type: string
      deploy_nc:
        description: 'Deploy NC instance (LCLS:8080)'
        type: boolean
        default: false
      deploy_sc:
        description: 'Deploy SC instance (LCLS:8081)'
        type: boolean
        default: false
      deploy_nlcta:
        description: 'Deploy NLCTA instance (TESTFAC:8080)'
        type: boolean
        default: false
      deploy_asta:
        description: 'Deploy ASTA instance (TESTFAC:8081)'
        type: boolean
        default: false
      deploy_facet:
        description: 'Deploy FACET instance (FACET:8080)'
        type: boolean
        default: false
      deploy_dev:
        description: 'Deploy DEV instance (DEV:8080)'
        type: boolean
        default: false
      migration_command:
        description: 'Migration command (empty = skip; set to "alembic upgrade head" once migrations exist)'
        required: false
        type: string
        default: ''
      force_deploy:
        description: 'Force deploy even if same tag is already running'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (ansible --check, no actual changes)'
        type: boolean
        default: false

permissions:
  deployments: write
  contents: read
  actions: read
  packages: read

jobs:
  # Fail fast if a selected instance's APP_SECRETS is unusable. software-factory's
  # deploy.sh parses APP_SECRETS with jq and dies with an opaque "Invalid numeric
  # literal" trace on a KEY=value/dotenv blob. And because the secret is the ONLY
  # config source (no env files are committed), a missing API_PORT would silently
  # fall back to deploy.sh's 8080 default and break the 8081 instances, and missing
  # URLs would only surface as a health-check timeout after a full deploy attempt.
  validate-secrets:
    runs-on: [self-hosted, deployment]
    env:
      DEPLOY_NC: ${{ inputs.deploy_nc }}
      DEPLOY_SC: ${{ inputs.deploy_sc }}
      DEPLOY_NLCTA: ${{ inputs.deploy_nlcta }}
      DEPLOY_ASTA: ${{ inputs.deploy_asta }}
      DEPLOY_FACET: ${{ inputs.deploy_facet }}
      DEPLOY_DEV: ${{ inputs.deploy_dev }}
      APP_SECRETS_NC: ${{ secrets.APP_SECRETS_NC }}
      APP_SECRETS_SC: ${{ secrets.APP_SECRETS_SC }}
      APP_SECRETS_NLCTA: ${{ secrets.APP_SECRETS_NLCTA }}
      APP_SECRETS_ASTA: ${{ secrets.APP_SECRETS_ASTA }}
      APP_SECRETS_FACET: ${{ secrets.APP_SECRETS_FACET }}
      APP_SECRETS_DEV: ${{ secrets.APP_SECRETS_DEV }}
    steps:
      - name: Validate selected APP_SECRETS
        run: |
          set -euo pipefail
          check() {
            local name="$1" val="$2" fac="$3"
            if [ -z "$val" ]; then
              echo "::error::$name is empty. All per-instance config (API_PORT, EPICS_*, URLs) lives in this secret - there are no committed env files. See DEPLOYMENT.md for the required JSON shape."
              exit 1
            fi
            echo "::add-mask::$val"
            if ! printf '%s' "$val" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::$name is not a JSON object. Re-store it as JSON (same shape software-factory/deploy.sh expects); a KEY=value/dotenv blob fails the jq merge."
              exit 1
            fi
            # deploy.sh renders (._shared * .<facility>) into the app's .env, and
            # defaults api_port to 8080 when API_PORT is absent - wrong for the
            # 8081 instances. Require the keys the app cannot run without.
            local missing
            missing=$(printf '%s' "$val" | jq -r --arg fac "$fac" '
              ((._shared // {}) * (.[$fac] // {})) as $m
              | ["API_PORT", "CANOPY_DATABASE_URL", "CANOPY_REDIS_URL"]
              | map(select((($m[.] // "") | tostring | length) == 0))
              | join(", ")')
            if [ -n "$missing" ]; then
              echo "::error::$name is missing required key(s) under \"$fac\" (or _shared): $missing. See DEPLOYMENT.md for the full secret shape."
              exit 1
            fi
          }
          # Plain `if`, not `&&`: under set -e a false `[ ]` test as the last
          # command on a line would abort the step.
          if [ "$DEPLOY_NC" = "true" ];    then check APP_SECRETS_NC "$APP_SECRETS_NC" CONTAINER_LCLS; fi
          if [ "$DEPLOY_SC" = "true" ];    then check APP_SECRETS_SC "$APP_SECRETS_SC" CONTAINER_LCLS; fi
          if [ "$DEPLOY_NLCTA" = "true" ]; then check APP_SECRETS_NLCTA "$APP_SECRETS_NLCTA" CONTAINER_TESTFAC; fi
          if [ "$DEPLOY_ASTA" = "true" ];  then check APP_SECRETS_ASTA "$APP_SECRETS_ASTA" CONTAINER_TESTFAC; fi
          if [ "$DEPLOY_FACET" = "true" ]; then check APP_SECRETS_FACET "$APP_SECRETS_FACET" CONTAINER_FACET; fi
          if [ "$DEPLOY_DEV" = "true" ];   then check APP_SECRETS_DEV "$APP_SECRETS_DEV" CONTAINER_DEV; fi
          echo "Selected APP_SECRETS validated."

  deploy-nc:
    needs: validate-secrets
    if: inputs.deploy_nc
    uses: slaclab/software-factory/.github/workflows/container-deploy.yml@main
    with:
      component_name: canopy-nc
      repository_name: Canopy
      tag: ${{ inputs.image_tag }}
      facilities: '["CONTAINER_LCLS"]'
      migration_command: ${{ inputs.migration_command }}
      health_check_path: /health
      force_deploy: ${{ inputs.force_deploy }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      APP_SECRETS: ${{ secrets.APP_SECRETS_NC }}

  deploy-sc:
    needs: validate-secrets
    if: inputs.deploy_sc
    uses: slaclab/software-factory/.github/workflows/container-deploy.yml@main
    with:
      component_name: canopy-sc
      repository_name: Canopy
      tag: ${{ inputs.image_tag }}
      facilities: '["CONTAINER_LCLS"]'
      migration_command: ${{ inputs.migration_command }}
      health_check_path: /health
      force_deploy: ${{ inputs.force_deploy }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      APP_SECRETS: ${{ secrets.APP_SECRETS_SC }}

  deploy-nlcta:
    needs: validate-secrets
    if: inputs.deploy_nlcta
    uses: slaclab/software-factory/.github/workflows/container-deploy.yml@main
    with:
      component_name: canopy-nlcta
      repository_name: Canopy
      tag: ${{ inputs.image_tag }}
      facilities: '["CONTAINER_TESTFAC"]'
      migration_command: ${{ inputs.migration_command }}
      health_check_path: /health
      force_deploy: ${{ inputs.force_deploy }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      APP_SECRETS: ${{ secrets.APP_SECRETS_NLCTA }}

  deploy-asta:
    needs: validate-secrets
    if: inputs.deploy_asta
    uses: slaclab/software-factory/.github/workflows/container-deploy.yml@main
    with:
      component_name: canopy-asta
      repository_name: Canopy
      tag: ${{ inputs.image_tag }}
      facilities: '["CONTAINER_TESTFAC"]'
      migration_command: ${{ inputs.migration_command }}
      health_check_path: /health
      force_deploy: ${{ inputs.force_deploy }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      APP_SECRETS: ${{ secrets.APP_SECRETS_ASTA }}

  deploy-facet:
    needs: validate-secrets
    if: inputs.deploy_facet
    uses: slaclab/software-factory/.github/workflows/container-deploy.yml@main
    with:
      component_name: canopy-facet
      repository_name: Canopy
      tag: ${{ inputs.image_tag }}
      facilities: '["CONTAINER_FACET"]'
      migration_command: ${{ inputs.migration_command }}
      health_check_path: /health
      force_deploy: ${{ inputs.force_deploy }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      APP_SECRETS: ${{ secrets.APP_SECRETS_FACET }}

  deploy-dev:
    needs: validate-secrets
    if: inputs.deploy_dev
    uses: slaclab/software-factory/.github/workflows/container-deploy.yml@main
    with:
      component_name: canopy
      repository_name: Canopy
      tag: ${{ inputs.image_tag }}
      facilities: '["CONTAINER_DEV"]'
      migration_command: ${{ inputs.migration_command }}
      health_check_path: /health
      force_deploy: ${{ inputs.force_deploy }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      APP_SECRETS: ${{ secrets.APP_SECRETS_DEV }}
