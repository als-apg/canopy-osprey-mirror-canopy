name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - canopy-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux runs the full suite, including the squirrel and magpie Postgres integration tests.
  tests-linux:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canopy
          POSTGRES_PASSWORD: canopy
          POSTGRES_DB: canopy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: "3.12"

    # The convert extra is a git source in a private repository; git reads this
    # rewrite when uv fetches it.
    - name: Read access to the converter mirror
      shell: bash
      env:
        CONVERTER_MIRROR_TOKEN: ${{ secrets.CONVERTER_MIRROR_TOKEN }}
      run: >-
        git config --global
        url."https://x-access-token:${CONVERTER_MIRROR_TOKEN}@github.com/als-apg/canopy-osprey-mirror-pydm-converter-tool".insteadOf
        "https://github.com/als-apg/canopy-osprey-mirror-pydm-converter-tool"

    - name: Install dependencies
      run: uv sync --group dev --all-extras

    - name: Check import contracts
      run: uv run --all-extras lint-imports

    # The mongo tests start this image with --pull never and the browser tests
    # drive Chromium; both fail, not skip, where their prerequisite is absent.
    - name: Pull the MongoDB image
      run: docker pull mongo:7

    - name: Install Chromium
      run: uv run --all-extras playwright install --with-deps chromium

    - name: Test with pytest
      run: uv run --all-extras coverage run -m pytest tests/ -v
      env:
        COVERAGE_FILE: ".coverage.linux"

    - name: Store coverage file
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-linux
        path: .coverage.linux
        include-hidden-files: true

  # The appliance set again, against the dependency versions an OSPREY image ships
  # (ci/osprey-pins.txt) instead of uv.lock: the data modules, the EPICS backend and
  # the MCP server.
  tests-pins:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        python-version: "3.12"

    # The convert extra is a git source in a private repository; git reads this
    # rewrite when uv fetches it.
    - name: Read access to the converter mirror
      shell: bash
      env:
        CONVERTER_MIRROR_TOKEN: ${{ secrets.CONVERTER_MIRROR_TOKEN }}
      run: >-
        git config --global
        url."https://x-access-token:${CONVERTER_MIRROR_TOKEN}@github.com/als-apg/canopy-osprey-mirror-pydm-converter-tool".insteadOf
        "https://github.com/als-apg/canopy-osprey-mirror-pydm-converter-tool"

    # The mongo tests start this image with --pull never; the browser tests drive
    # the Chromium build of the pinned Playwright.
    - name: Pull the MongoDB image
      run: docker pull mongo:7

    - name: Install Chromium for the pinned Playwright
      run: uvx --from "$(grep -E '^playwright==' ci/osprey-pins.txt)" playwright install --with-deps chromium

    - name: Test under the OSPREY pins
      run: >-
        ci/run-under-pins.sh
        tests/canopy/hare
        tests/canopy/vole
        tests/canopy/fox
        tests/canopy/mole
        tests/canopy/epics
        tests/canopy/core/test_keys_file.py
        tests/canopy/test_module_selection.py
        tests/canopy/test_closed_meta.py
        tests/canopy_mcp

  # Windows/macOS runners can't run service containers, so skip those tests (their conftest
  # skips when Postgres is unreachable). They run on pushes to the integration branches and on
  # dispatch, not on pull requests: their minutes bill at 2x (Windows) and 10x (macOS) Linux's.
  tests-other:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    permissions:
      pull-requests: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: ${{ matrix.python-version }}

    # The convert extra is a git source in a private repository; git reads this
    # rewrite when uv fetches it.
    - name: Read access to the converter mirror
      shell: bash
      env:
        CONVERTER_MIRROR_TOKEN: ${{ secrets.CONVERTER_MIRROR_TOKEN }}
      run: >-
        git config --global
        url."https://x-access-token:${CONVERTER_MIRROR_TOKEN}@github.com/als-apg/canopy-osprey-mirror-pydm-converter-tool".insteadOf
        "https://github.com/als-apg/canopy-osprey-mirror-pydm-converter-tool"

    - name: Install dependencies
      run: uv sync --group dev --all-extras

    - name: Install Chromium
      run: uv run --all-extras playwright install chromium

    # No Docker daemon that runs Linux images here, so the mongo tests are
    # deselected by their marker; tests-linux and tests-pins run them.
    - name: Test with pytest
      run: uv run --all-extras coverage run -m pytest tests/ -v -m "not mongo"
      env:
        COVERAGE_FILE: ".coverage.${{ matrix.python-version }}.${{ matrix.os }}"

    - name: Store coverage file
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-${{ matrix.python-version }}.${{ matrix.os }}
        path: .coverage.${{ matrix.python-version }}.${{ matrix.os }}
        include-hidden-files: true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [tests-linux, tests-other]
    # On pull requests tests-other is skipped; the comment then covers the Linux run alone.
    if: ${{ !cancelled() && needs.tests-linux.result == 'success' && needs.tests-other.result != 'failure' }}
    permissions:
      pull-requests: write
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: coverage-*
        merge-multiple: true

    - name: Coverage comment
      id: coverage_comment
      uses: py-cov-action/python-coverage-comment-action@5d8df5979747514c914e1c5a12335a7cf9a2745f # v4.1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MERGE_COVERAGE_FILES: true

    - name: Store Pull Request comment to be posted
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
      with:
        name: python-coverage-comment-action
        path: python-coverage-comment-action.txt
