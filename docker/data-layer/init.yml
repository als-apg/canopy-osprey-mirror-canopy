# Initialize the data layer (postgres + redis) for one canopy instance.
#
# Required extra-vars (passed by .github/workflows/init-data-layer.yml):
#   instance           one of NC / SC / NLCTA / ASTA / FACET / DEV
#   confirm_instance   must equal `instance`; gate against fat-fingering
#   mode               init     fresh bring-up; refuses if any container/volume exists
#                      recreate bring containers back against the EXISTING volume
#                               (no data loss): docker start if present, docker run
#                               if absent. Use when a container was stopped/removed.
#                               NOTE: postgres ignores POSTGRES_PASSWORD on an already
#                               initialized volume, so recreate never applies a rotated
#                               password - rotate via ALTER USER, then update the secret.
#                               The authenticated health check below fails loudly on drift.
#                      wipe     pg_dump, then destroy containers + volume, recreate fresh
#   backup_root        directory on the target host where pg_dump output goes
#   facility           Ansible host group from instances.yml[instance].facility
#   postgres_password  from APP_SECRETS_<INSTANCE> (._shared * .<FACILITY>).POSTGRES_PASSWORD
#   redis_password     from APP_SECRETS_<INSTANCE> (._shared * .<FACILITY>).REDIS_PASSWORD
#
# Run with --check for a dry run.

- name: Initialize data layer for {{ instance | default('UNSET') }}
  hosts: "{{ facility }}"
  gather_facts: true
  vars_files:
    - instances.yml
  vars:
    cfg: "{{ instances[instance] }}"
    backup_dir: "{{ backup_root }}/{{ instance }}"
  tasks:
    - name: Confirmation gate
      assert:
        that:
          - instance is defined
          - instance in instances.keys()
          - confirm_instance is defined
          - confirm_instance == instance
          - (mode | default('init')) in ['init', 'recreate', 'wipe']
        fail_msg: >-
          Refusing to proceed. Required: instance in
          {{ instances.keys() | list }}, confirm_instance == instance, and
          mode in [init, recreate, wipe].
          Got instance={{ instance | default('UNSET') }},
          confirm_instance={{ confirm_instance | default('UNSET') }},
          mode={{ mode | default('init') }}.

    # Kept separate and no_log so a failed gate above still shows its message;
    # this one only checks presence, never prints the secret values.
    - name: Require non-empty passwords
      assert:
        that:
          - postgres_password | default('') | length > 0
          - redis_password | default('') | length > 0
        fail_msg: >-
          postgres_password / redis_password must be passed as non-empty
          extra-vars (sourced from APP_SECRETS_{{ instance | default('?') }}).
      no_log: true

    - name: Normalize mode
      set_fact:
        mode: "{{ mode | default('init') }}"

    - name: Inspect postgres container
      command: docker inspect {{ cfg.container_postgres }}
      register: pg_inspect
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Inspect redis container
      command: docker inspect {{ cfg.container_redis }}
      register: redis_inspect
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Inspect postgres volume
      command: docker volume inspect {{ cfg.volume_postgres }}
      register: vol_inspect
      failed_when: false
      changed_when: false
      check_mode: false

    # Read-only reconnaissance, printed before any gate can refuse. CI is the
    # only eye on these hosts, so every run - including --check dry runs -
    # reports the state it saw: leftover containers, who holds the host ports,
    # whether the image is present, and the daemon's proxy config. Nothing
    # here touches secrets.
    - name: Collect host diagnostics
      shell: |
        echo '=== docker ps -a (this instance) ==='
        docker ps -a --filter name={{ cfg.container_postgres }} --filter name={{ cfg.container_redis }}
        echo '=== docker logs {{ cfg.container_postgres }} (last 30) ==='
        docker logs --tail 30 {{ cfg.container_postgres }} 2>&1 || true
        echo '=== docker logs {{ cfg.container_redis }} (last 30) ==='
        docker logs --tail 30 {{ cfg.container_redis }} 2>&1 || true
        echo '=== listeners on host ports {{ cfg.host_port_postgres }} / {{ cfg.host_port_redis }} ==='
        ss -tlnp | grep -E ':({{ cfg.host_port_postgres }}|{{ cfg.host_port_redis }})\s' || echo '(none)'
        echo '=== image {{ postgres_image }} present locally? ==='
        docker image inspect {{ postgres_image }} --format present || echo 'absent (docker run will need to pull)'
        echo '=== docker daemon proxy config ==='
        docker info 2>/dev/null | grep -i proxy || echo '(none reported)'
      register: diag
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Host diagnostics
      debug:
        msg: "{{ diag.stdout_lines | default(['(diagnostics unavailable: ' ~ (diag.stderr | default('unknown')) ~ ')']) }}"

    - name: Refuse if any data-layer object exists and mode is init
      fail:
        msg: |
          Data layer for instance {{ instance }} already has state on this host.
            container {{ cfg.container_postgres }}: {{ 'PRESENT' if pg_inspect.rc == 0 else 'absent' }}
            container {{ cfg.container_redis }}:    {{ 'PRESENT' if redis_inspect.rc == 0 else 'absent' }}
            volume    {{ cfg.volume_postgres }}:    {{ 'PRESENT' if vol_inspect.rc == 0 else 'absent' }}
          Use mode=recreate to bring existing containers back without data loss, or
          mode=wipe to destroy and rebuild (ONLY after verifying a current backup exists).
      when:
        - (mode | default('init')) == 'init'
        - pg_inspect.rc == 0 or redis_inspect.rc == 0 or vol_inspect.rc == 0

    - name: Refuse to wipe when volume exists but its postgres container does not
      fail:
        msg: |
          Volume {{ cfg.volume_postgres }} exists but container {{ cfg.container_postgres }}
          is missing. Auto-backup needs a running postgres bound to that volume.
          Use mode=recreate to re-attach the volume to a fresh container (no wipe),
          take your own pg_dump, then rerun with mode=wipe if you really want to destroy it.
      when:
        - mode == 'wipe'
        - pg_inspect.rc != 0
        - vol_inspect.rc == 0

    - name: Backup before wipe
      when:
        - mode == 'wipe'
        - pg_inspect.rc == 0
      block:
        - name: Inspect postgres running state
          command: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' {{ cfg.container_postgres }}
          register: pg_state
          changed_when: false
          check_mode: false

        - name: Start postgres temporarily for backup
          command: docker start {{ cfg.container_postgres }}
          when: pg_state.stdout | trim == 'false'

        - name: Wait for postgres to accept connections
          command: docker exec {{ cfg.container_postgres }} pg_isready -U {{ cfg.postgres_user }} -d {{ cfg.postgres_db }}
          register: pg_ready
          retries: 20
          delay: 2
          until: pg_ready.rc == 0
          changed_when: false

        - name: Ensure backup directory exists
          file:
            path: "{{ backup_dir }}"
            state: directory
            mode: "0750"

        - name: Set backup path
          set_fact:
            backup_path: "{{ backup_dir }}/pg_{{ instance }}_{{ ansible_date_time.iso8601_basic_short }}.sql.gz"

        # `docker exec -e PGPASSWORD` (no value) inherits the variable from the
        # docker CLI's environment, set via `environment:` below - the password
        # never appears in a process argv, so the task stays debuggable (no no_log).
        - name: Run pg_dump
          shell: >-
            set -o pipefail;
            docker exec -e PGPASSWORD {{ cfg.container_postgres }}
            pg_dump -U {{ cfg.postgres_user }} -d {{ cfg.postgres_db }}
            | gzip > '{{ backup_path }}'
          args:
            executable: /bin/bash
          environment:
            PGPASSWORD: "{{ postgres_password }}"

        - name: Backup (check mode)
          debug:
            msg: "Check mode: would pg_dump to {{ backup_path }} before wiping."
          when: ansible_check_mode

        - name: Verify backup integrity
          command: gzip -t {{ backup_path }}
          changed_when: false
          when: not ansible_check_mode

        - name: Verify backup is non-empty
          stat:
            path: "{{ backup_path }}"
          register: backup_stat
          when: not ansible_check_mode

        - name: Fail if backup looks suspiciously small
          fail:
            msg: "pg_dump output at {{ backup_path }} is < 100 bytes; refusing to wipe."
          when:
            - not ansible_check_mode
            - (backup_stat.stat.size | default(0) | int) < 100

        - name: Backup written
          debug:
            msg: "Backup OK: {{ backup_path }} ({{ backup_stat.stat.size }} bytes)"
          when: not ansible_check_mode

    - name: Remove postgres container
      command: docker rm -f {{ cfg.container_postgres }}
      when:
        - mode == 'wipe'
        - pg_inspect.rc == 0

    - name: Remove redis container
      command: docker rm -f {{ cfg.container_redis }}
      when:
        - mode == 'wipe'
        - redis_inspect.rc == 0

    - name: Remove postgres volume
      command: docker volume rm {{ cfg.volume_postgres }}
      when:
        - mode == 'wipe'
        - vol_inspect.rc == 0

    # recreate mode: an existing container is started in place (no-op if already
    # running). docker start preserves the container's original config and volume
    # mount, so data is untouched. A new docker run happens only when absent.
    - name: Start existing postgres (recreate)
      command: docker start {{ cfg.container_postgres }}
      when:
        - mode == 'recreate'
        - pg_inspect.rc == 0

    # Pass POSTGRES_PASSWORD via `-e POSTGRES_PASSWORD` (no value) so docker
    # inherits it from the CLI's environment, set via `environment:` below - the
    # password never appears in argv, so the task stays debuggable (no no_log),
    # same pattern as the pg_dump / psql health-check tasks.
    - name: Run postgres
      command:
        argv:
          - docker
          - run
          - -d
          - --name
          - "{{ cfg.container_postgres }}"
          - --restart
          - unless-stopped
          - -e
          - "POSTGRES_USER={{ cfg.postgres_user }}"
          - -e
          - POSTGRES_PASSWORD
          - -e
          - "POSTGRES_DB={{ cfg.postgres_db }}"
          - -p
          - "127.0.0.1:{{ cfg.host_port_postgres }}:5432"
          - -v
          - "{{ cfg.volume_postgres }}:/var/lib/postgresql/data"
          - "{{ postgres_image }}"
      environment:
        POSTGRES_PASSWORD: "{{ postgres_password }}"
      when: mode != 'recreate' or pg_inspect.rc != 0

    - name: Start existing redis (recreate)
      command: docker start {{ cfg.container_redis }}
      when:
        - mode == 'recreate'
        - redis_inspect.rc == 0

    - name: Run redis
      command:
        argv:
          - docker
          - run
          - -d
          - --name
          - "{{ cfg.container_redis }}"
          - --restart
          - unless-stopped
          - -p
          - "127.0.0.1:{{ cfg.host_port_redis }}:6379"
          - "{{ redis_image }}"
          - redis-server
          - --requirepass
          - "{{ redis_password }}"
      when: mode != 'recreate' or redis_inspect.rc != 0
      no_log: true

    # Connect over TCP (-h 127.0.0.1) so postgres enforces password auth - the
    # unix socket is trust-mode in the official image and would pass regardless.
    # This catches password drift, e.g. a rotated secret against a pre-existing
    # volume in recreate mode (postgres ignores POSTGRES_PASSWORD there).
    - name: Wait for postgres to accept authenticated connections
      command:
        argv:
          - docker
          - exec
          - -e
          - PGPASSWORD
          - "{{ cfg.container_postgres }}"
          - psql
          - -h
          - 127.0.0.1
          - -U
          - "{{ cfg.postgres_user }}"
          - -d
          - "{{ cfg.postgres_db }}"
          - -c
          - SELECT 1
      environment:
        PGPASSWORD: "{{ postgres_password }}"
      register: pg_health
      retries: 30
      delay: 1
      until: pg_health.rc == 0
      changed_when: false

    - name: Wait for redis to be healthy
      command:
        argv:
          - docker
          - exec
          - "{{ cfg.container_redis }}"
          - redis-cli
          - --no-auth-warning
          - -a
          - "{{ redis_password }}"
          - ping
      register: redis_health
      retries: 30
      delay: 1
      until:
        - redis_health.rc == 0
        - (redis_health.stdout | trim) == 'PONG'
      changed_when: false
      no_log: true

    - name: Summary
      debug:
        msg:
          - "instance:           {{ instance }}"
          - "mode:               {{ mode | default('init') }}"
          - "facility:           {{ cfg.facility }}"
          - "postgres container: {{ cfg.container_postgres }} on 127.0.0.1:{{ cfg.host_port_postgres }}"
          - "redis container:    {{ cfg.container_redis }} on 127.0.0.1:{{ cfg.host_port_redis }}"
          - "volume:             {{ cfg.volume_postgres }}"
          - "backup:             {{ backup_path | default('(none - only taken on mode=wipe)') }}"
