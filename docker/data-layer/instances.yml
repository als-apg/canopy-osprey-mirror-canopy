# Per-instance non-secret config for the data layer (postgres + redis).
# Passwords come from APP_SECRETS_<INSTANCE> at workflow time, not this file.
# The URLs in APP_SECRETS_<INSTANCE> encode the same user / db / host port as
# this file. When you change one, change the other.
#
# APP_SECRETS_<INSTANCE> is the same secret software-factory's deploy uses, and
# it is the ONLY config source for the app - no env files are committed. Beyond
# the data-layer keys below it must carry the full app config (API_PORT,
# CANOPY_*, EPICS_*); the complete shape is documented in DEPLOYMENT.md.
# Shape (facility block wins over _shared, same as deploy.sh):
#   {
#     "_shared": { ... },
#     "<FACILITY>": {            # e.g. CONTAINER_LCLS, CONTAINER_DEV
#       "POSTGRES_PASSWORD": "...",
#       "REDIS_PASSWORD": "...",
#       "CANOPY_DATABASE_URL": "postgresql+asyncpg://canopy:<pw>@127.0.0.1:<port>/<db>",
#       "CANOPY_REDIS_URL": "redis://:<pw>@127.0.0.1:<port>/0",
#       ... app config keys, see DEPLOYMENT.md ...
#     }
#   }
# The init workflow verifies POSTGRES_PASSWORD / REDIS_PASSWORD match the
# passwords embedded in those URLs, so keep them in sync.
#
# Access path: the app containers run with network_mode: host (EPICS CA/PVA
# needs UDP broadcast), so they reach postgres/redis via the 127.0.0.1 host
# ports published below - there is deliberately no shared docker network.

instances:
  NC:
    facility: CONTAINER_LCLS
    container_postgres: canopy-nc-postgres
    container_redis: canopy-nc-redis
    volume_postgres: pg_nc_data
    host_port_postgres: 5432
    host_port_redis: 6379
    postgres_user: canopy
    postgres_db: canopy_nc

  SC:
    facility: CONTAINER_LCLS
    container_postgres: canopy-sc-postgres
    container_redis: canopy-sc-redis
    volume_postgres: pg_sc_data
    host_port_postgres: 5433
    host_port_redis: 6380
    postgres_user: canopy
    postgres_db: canopy_sc

  NLCTA:
    facility: CONTAINER_TESTFAC
    container_postgres: canopy-nlcta-postgres
    container_redis: canopy-nlcta-redis
    volume_postgres: pg_nlcta_data
    host_port_postgres: 5432
    host_port_redis: 6379
    postgres_user: canopy
    postgres_db: canopy_nlcta

  ASTA:
    facility: CONTAINER_TESTFAC
    container_postgres: canopy-asta-postgres
    container_redis: canopy-asta-redis
    volume_postgres: pg_asta_data
    host_port_postgres: 5433
    host_port_redis: 6380
    postgres_user: canopy
    postgres_db: canopy_asta

  FACET:
    facility: CONTAINER_FACET
    container_postgres: canopy-facet-postgres
    container_redis: canopy-facet-redis
    volume_postgres: pg_facet_data
    host_port_postgres: 5432
    host_port_redis: 6379
    postgres_user: canopy
    postgres_db: canopy_facet

  DEV:
    facility: CONTAINER_DEV
    container_postgres: canopy-dev-postgres
